data:
  root: datasets/THU-EACT-50-CHL
  train_split: train
  test_split: test
  val_fraction: 0.15
  split_seed: 42
  region_seed: 123
  max_samples: 0
  image_width: 346
  image_height: 260
  time_unit: 0.000001
  time_bins: 32
  crop_fraction: [0.3, 1.0]
  eval_fraction: 1.0
  patch_norm: region_max
  cstr_max_count: 20
  patch_cache:
    enabled: true
    dir: outputs/hierarchical_mae_patches
    # 0: fresh random training crops; cache only fixed evaluation crops.
    # See thu_cached.yaml for a reusable training crop bank.
    train_views: 0
    rebuild: false
hierarchy:
  # Maximum number of cells along x,y,t, NOT binary split depth.
  max_splits: [4, 4, 8]
  levels:
    - {splits: [1, 1, 1], patch_size: 24, representations: [xy, xt, yt, cstr3]}
    - {splits: [2, 2, 2], patch_size: 16, representations: [xy, xt, yt, cstr3]}
    - {splits: [4, 4, 8], patch_size: 8, representations: [xy, xt, yt]}
model:
  embed_dim: 128
  decoder_dim: 64
  num_heads: 4
  num_layers: 4
  decoder_layers: 2
masking:
  strategy: mixed
  ratio: 0.65
  # Half the examples explicitly learn overlapping cross-level/cross-plane reconstruction.
  overlap_probability: 0.5
  # Strict examples mask subtrees at this level; visible subtrees retain overlaps.
  level: 1
selection:
  strategy: all
  budget: 0
loss:
  count_weight: 0.1
train:
  device: cuda
  seed: 7
  batch_size: 32
  epochs: 200
  lr: 0.0002
  weight_decay: 0.05
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  log_every: 10
  max_batches: 0
  max_val_batches: 0
  output_dir: outputs/hierarchical_mae
  inspect_every: 10
  inspect_per_group: 4
downstream:
  epochs: 100
  batch_size: 64
  lr: 0.001
  encoder_lr: 0.00002
  weight_decay: 0.0001
  num_classes: 50
  max_batches: 0
  max_test_samples: 0
  selection: {strategy: all, budget: 0}
  feature_cache:
    dir: outputs/hierarchical_mae_features
    batch_size: 32
    rebuild: false
